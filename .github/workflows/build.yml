name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-30" "build-tools;35.0.0"
      - name: Build, test, lint and stage Maven artifacts
        run: bash gradlew --no-daemon assembleRelease testReleaseUnitTest lintRelease publishReleasePublicationToBuildRepository
      - name: Compile a consumer against the published Maven artifact
        run: bash gradlew -p smoke-test --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ftclogger-maven
          path: build/repository/
